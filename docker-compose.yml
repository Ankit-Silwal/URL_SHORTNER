services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: url_shortner
      POSTGRES_PASSWORD: url_shortner
      POSTGRES_DB: url_shortner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortner -d url_shortner"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ./backend
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://url_shortner:url_shortner@postgres:5432/url_shortner
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://url_shortner:url_shortner@postgres:5432/url_shortner
      REDIS_URL: redis://redis:6379
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget","-qO-","http://localhost:4000/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command:  ["node","dist/worker.js"]
    environment:
      - DATABASE_URL=postgresql://url_shortner:url_shortner@postgres:5432/url_shortner
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
