services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: url_shortner
      POSTGRES_PASSWORD: url_shortner
      POSTGRES_DB: url_shortner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortner -d url_shortner"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 2s
      timeout: 3s
      retries: 1

  migrate:
    build:
      context: ./backend
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://url_shortner:url_shortner@postgres:5432/url_shortner
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    container_name: backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://url_shortner:url_shortner@postgres:5432/url_shortner
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: